<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202023">
  <meta name="description" content="Vellum — a local-first, WebGPU-powered design editor. Plain HTML, CSS and JavaScript.">
  <title>Vellum — a little more possible.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%238b6cff'/%3E%3Cpath d='m9 11 10 20 12-20h-7l-5 10-5-10z' fill='white'/%3E%3C/svg%3E">
  <style>:root {
  --ui-font: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --accent: #a38bff;
  --accent-strong: #8b6bf5;
  --accent-bg: #352d4b;
  --panel: #242426;
  --panel-2: #2b2b2e;
  --panel-3: #323236;
  --field: #303033;
  --hover: #343437;
  --border: #37373b;
  --border-soft: #303033;
  --text: #f0eff2;
  --text-secondary: #b7b5bf;
  --muted: #85838e;
  --canvas: #1a1a1d;
  --dot: #343439;
  --shadow: 0 12px 36px #0004;
  --left: 236px;
  --right: 280px;
  --selection: #a28aff;
  --danger: #f17982;
  --success: #8ac5a7;
  --checker: repeating-conic-gradient(#bbb 0% 25%,#eee 0% 50%) 50%/10px 10px;
  color-scheme: dark
}

html[data-theme="light"] {
  --panel: #fff;
  --panel-2: #f7f7f8;
  --panel-3: #f1f0f4;
  --field: #f2f1f5;
  --hover: #efedf5;
  --border: #e4e2e8;
  --border-soft: #eeedf1;
  --text: #26232e;
  --text-secondary: #605d6a;
  --muted: #928d9c;
  --canvas: #e8e7ec;
  --dot: #cccad4;
  --accent: #7954df;
  --accent-strong: #7954df;
  --accent-bg: #ece6fa;
  --shadow: 0 12px 36px #32204a18;
  color-scheme: light
}

* {
  box-sizing: border-box
}

body {
  margin: 0;
  font: 12px var(--ui-font);
  color: var(--text);
  background: var(--canvas);
  overflow: hidden;
  -webkit-font-smoothing: antialiased
}

button,input,select,textarea {
  font: inherit
}

button {
  border: 0;
  cursor: pointer;
  color: inherit;
  background: none;
  padding: 0
}

button:disabled {
  opacity: .35;
  cursor: default
}

button:focus-visible,input:focus-visible,select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px
}

input,select,textarea {
  color: var(--text);
  border: 1px solid transparent;
  background: var(--field);
  border-radius: 6px;
  min-width: 0
}

input:hover,select:hover {
  border-color: var(--border)
}

input:focus,textarea:focus {
  outline: none;
  border-color: var(--accent)
}

input[type=number] {
  appearance: textfield;
  -moz-appearance: textfield
}

input::-webkit-outer-spin-button,input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0
}

input[type=color] {
  padding: 0;
  width: 25px;
  height: 25px;
  border: 0;
  cursor: pointer;
  background: none;
  flex-shrink: 0
}

input[type=color]::-webkit-color-swatch-wrapper {
  padding: 3px
}

input[type=color]::-webkit-color-swatch {
  border: 1px solid #ffffff24;
  border-radius: 4px
}

input[type=range] {
  accent-color: var(--accent);
  padding: 0;
  height: 20px;
  background: none;
  border: 0
}

select {
  height: 31px;
  padding: 0 9px
}

a {
  color: var(--accent)
}

svg {
  flex-shrink: 0;
  vertical-align: middle
}

button svg {
  pointer-events: none
}

.hidden {
  display: none!important
}

.muted {
  color: var(--muted)
}

.icon-button {
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  color: var(--text-secondary);
  flex-shrink: 0
}

.icon-button:hover {
  background: var(--hover);
  color: var(--text)
}

.icon-button.small {
  width: 25px;
  height: 25px
}

.icon-button svg {
  width: 16px;
  height: 16px
}

.topbar {
  height: 52px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  z-index: 20;
  position: relative
}

.brand-section {
  width: var(--left);
  padding: 0 13px 0 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text)
}

.brand>svg {
  color: var(--accent)
}

.brand>span:not(.brand-chevron) {
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -.9px
}

.brand-chevron {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 4px 3px
}

.top-divider {
  width: 1px;
  height: 20px;
  background: var(--border)
}

.file-breadcrumb {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  white-space: nowrap;
  min-width: 0
}

.file-breadcrumb #file-name {
  font-weight: 550;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 300px
}

.file-breadcrumb #file-name:hover {
  color: var(--accent)
}

.crumb-slash {
  color: var(--border);
  font-size: 18px
}

.file-chevron {
  color: var(--muted)
}

.save-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 10px;
  margin-left: 8px
}

.save-indicator i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--success)
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 15px
}

.local-badge {
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--muted);
  font-weight: 650
}

.avatar {
  border-radius: 50%;
  width: 27px;
  height: 27px;
  background: #574675;
  color: #e3d9fa;
  font-size: 10px;
  border: 2px solid var(--panel)
}

.share-button {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 13px;
  border-radius: 7px;
  background: var(--accent-strong);
  font-weight: 550;
  font-size: 11px;
  color: white
}

.share-button:hover {
  filter: brightness(1.12)
}

.share-button svg {
  width: 13px;
  height: 13px
}

.workspace {
  display: grid;
  grid-template-columns: var(--left) minmax(0,1fr) var(--right);
  height: calc(100dvh - 52px)
}

.left-panel,.right-panel {
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
  z-index: 10
}

.left-panel {
  border-right: 1px solid var(--border)
}

.right-panel {
  border-left: 1px solid var(--border)
}

.left-heading {
  height: 52px;
  padding: 0 14px 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 550;
  font-size: 13px
}

.left-tabs {
  height: 39px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 13px 0 18px;
  border-bottom: 1px solid var(--border-soft)
}

.left-tabs>button:not(.icon-button) {
  height: 39px;
  font-size: 11px;
  color: var(--muted);
  position: relative
}

.left-tabs>button.active {
  color: var(--text);
  font-weight: 600
}

.left-tabs>button.active:after {
  content: "";
  height: 2px;
  background: var(--accent);
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  border-radius: 2px
}

.left-tabs .icon-button {
  margin-left: auto
}

.pages-heading,.layers-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 17px 14px 8px 18px;
  font-size: 10px;
  font-weight: 600
}

.pages-heading {
  padding-top: 15px;
  color: var(--text-secondary)
}

.page-list {
  padding: 0 10px 12px;
  border-bottom: 1px solid var(--border-soft)
}

.page-row {
  width: 100%;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 9px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-secondary)
}

.page-row svg {
  width: 13px;
  height: 13px;
  color: var(--muted)
}

.page-row.active {
  color: var(--accent);
  background: var(--accent-bg);
  font-weight: 500
}

.page-row.active svg {
  color: var(--accent)
}

.page-row .page-check {
  margin-left: auto;
  font-size: 13px
}

.page-row:hover:not(.active) {
  background: var(--hover)
}

.layers-heading {
  padding-top: 16px;
  padding-bottom: 12px
}

.layers-heading .muted {
  font-size: 9px;
  font-weight: 400
}

.layer-tree {
  overflow: auto;
  flex: 1;
  padding-bottom: 20px;
  user-select: none;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent
}

.layer-row {
  height: 32px;
  display: flex;
  align-items: center;
  padding: 0 10px 0 calc(10px + var(--depth)*15px);
  gap: 7px;
  font-size: 10.5px;
  cursor: default;
  position: relative;
  white-space: nowrap;
  border: 1px solid transparent
}

.layer-row:hover {
  background: var(--hover)
}

.layer-row.selected {
  background: var(--accent-bg);
  border-color: #a38bff25
}

.layer-row.selected .layer-icon {
  color: var(--accent)
}

.layer-row .layer-name {
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1
}

.layer-row .layer-icon {
  color: var(--muted);
  display: flex
}

.layer-row .layer-icon svg {
  width: 13px;
  height: 13px
}

.layer-row .expand {
  width: 10px;
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0
}

.layer-row .visibility,.layer-row .lock {
  opacity: 0;
  width: 17px;
  color: var(--muted)
}

.layer-row:hover .visibility,.layer-row:hover .lock,.layer-row .visibility.is-hidden,.layer-row .lock.is-locked {
  opacity: 1
}

.layer-row .visibility svg,.layer-row .lock svg {
  width: 12px;
  height: 12px
}

.layer-row.dim .layer-name {
  opacity: .4
}

.layer-row.component .layer-icon {
  color: #b296ff
}

.layer-row.drop-target {
  border-top-color: var(--accent)
}

.layer-search {
  margin: 10px;
  display: flex;
  align-items: center;
  background: var(--field);
  padding: 0 8px;
  border-radius: 6px
}

.layer-search svg {
  width: 13px;
  color: var(--muted)
}

.layer-search input {
  width: 100%;
  height: 31px;
  padding-left: 7px;
  border: 0;
  background: none
}

.left-footer {
  height: 43px;
  border-top: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 12px;
  font-size: 9px;
  color: var(--muted)
}

.left-footer .icon-button {
  margin-left: auto
}

.engine-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--success)
}

.canvas-area {
  position: relative;
  overflow: hidden;
  min-width: 0;
  touch-action: none
}

.canvas-world {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  background-image: radial-gradient(var(--dot) .7px,transparent .7px);
  background-size: 20px 20px
}

.canvas-area>canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  outline: none
}

.canvas-area #overlay {
  touch-action: none
}

.canvas-topline {
  position: absolute;
  left: 24px;
  right: 24px;
  top: 19px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none
}

.canvas-crumb {
  font-size: 10px;
  color: var(--muted)
}

.canvas-pill {
  display: flex;
  gap: 6px;
  align-items: center;
  color: var(--muted);
  font-size: 9px;
  pointer-events: auto
}

.canvas-pill i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--success)
}

.canvas-footer {
  position: absolute;
  bottom: 13px;
  left: 19px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  pointer-events: none
}

.canvas-hint {
  color: var(--muted);
  font-size: 9px
}

.canvas-hint span {
  margin: 0 8px;
  opacity: .5
}

.performance {
  color: var(--muted);
  font-size: 9px;
  font-variant-numeric: tabular-nums
}

.floating-toolbar {
  position: absolute;
  bottom: 49px;
  left: 50%;
  transform: translateX(-50%);
  height: 48px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 6px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 6px 22px #0003;
  white-space: nowrap
}

.tool {
  width: 34px;
  height: 34px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary)
}

.tool svg {
  width: 19px;
  height: 19px
}

.tool:hover {
  background: var(--hover);
  color: var(--text)
}

.tool.active {
  background: var(--accent-strong);
  color: #fff
}

.toolbar-divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 3px
}

.accent-tool {
  color: var(--accent)
}

.zoom-controls {
  position: absolute;
  right: 18px;
  bottom: 51px;
  height: 34px;
  display: flex;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 2px 4px;
  border-radius: 7px;
  box-shadow: 0 2px 10px #0001
}

.zoom-controls #zoom-value {
  min-width: 43px;
  font-size: 10px;
  font-variant-numeric: tabular-nums
}

.zoom-controls .icon-button {
  width: 20px;
  height: 24px
}

.zoom-controls svg {
  width: 12px;
  height: 12px
}

.welcome-tip {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 120px;
  border: 1px solid var(--border);
  background: var(--panel);
  box-shadow: var(--shadow);
  padding: 13px 12px;
  display: flex;
  gap: 11px;
  align-items: center;
  border-radius: 10px;
  white-space: nowrap;
  animation: tip-in .4s ease-out
}

.welcome-tip .welcome-icon {
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 31px;
  height: 31px;
  border-radius: 8px;
  background: var(--accent-bg)
}

.welcome-tip svg {
  width: 16px;
  height: 16px
}

.welcome-tip strong {
  font-size: 11px;
  font-weight: 550
}

.welcome-tip p {
  font-size: 9px;
  color: var(--muted);
  margin: 5px 0 0
}

.welcome-tip .icon-button {
  align-self: flex-start;
  margin-left: 8px
}

.inspector-tabs {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 0 17px;
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0
}

.inspector-tabs>button:not(.icon-button) {
  height: 52px;
  color: var(--muted);
  font-size: 11px;
  position: relative
}

.inspector-tabs>button.active {
  font-weight: 600;
  color: var(--text)
}

.inspector-tabs>button.active:after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--accent)
}

.inspector-tabs>.icon-button {
  margin-left: auto
}

.inspector-scroll {
  overflow: auto;
  flex: 1;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent
}

.inspector-section {
  padding: 17px 16px;
  border-bottom: 1px solid var(--border-soft)
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
  min-height: 19px;
  font-weight: 550;
  font-size: 11px
}

.section-heading .icon-button {
  margin: -4px -4px -4px 0
}

.section-heading svg {
  width: 14px;
  height: 14px
}

.section-title {
  display: flex;
  align-items: center;
  gap: 8px
}

.section-title>svg {
  color: var(--accent);
  width: 14px;
  height: 14px
}

.inspector-section p {
  font-size: 10px;
  line-height: 1.7;
  color: var(--muted);
  margin: 9px 0 0
}

.selection-name {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
  max-width: 206px
}

.selection-meta {
  color: var(--muted);
  font-size: 9px;
  margin-top: 6px
}

.property-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px
}

.property-grid.three {
  grid-template-columns: 1fr 1fr 1fr
}

.field {
  display: flex;
  align-items: center;
  background: var(--field);
  border: 1px solid transparent;
  border-radius: 6px;
  min-width: 0;
  height: 31px;
  overflow: hidden
}

.field:hover {
  border-color: var(--border)
}

.field:focus-within {
  border-color: var(--accent)
}

.field>span {
  font-size: 10px;
  color: var(--muted);
  width: 28px;
  text-align: center;
  flex-shrink: 0;
  cursor: ew-resize
}

.field>span svg {
  width: 12px;
  height: 12px
}

.field input {
  height: 29px;
  border: 0;
  background: none;
  width: 100%;
  min-width: 0;
  padding: 0 7px 0 0;
  font-size: 10px
}

.field input:focus {
  border: 0;
  outline: 0
}

.field .unit {
  font-size: 9px;
  color: var(--muted);
  margin-right: 8px
}

.full-width {
  width: 100%
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 8px
}

.field-label {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--muted);
  margin: 10px 0 7px
}

.align-buttons {
  display: flex;
  justify-content: space-between;
  margin-bottom: 13px
}

.align-buttons button {
  width: 30px;
  height: 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  border-radius: 5px
}

.align-buttons button:hover {
  background: var(--hover)
}

.align-buttons svg {
  width: 15px;
  height: 15px
}

.fill-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px
}

.fill-row .hex-field {
  flex: 1;
  display: flex;
  align-items: center;
  border-radius: 6px;
  background: var(--field);
  height: 31px;
  padding-left: 3px;
  min-width: 0
}

.fill-row .hex-field input[type=text] {
  width: 100%;
  background: none;
  border: 0;
  font-size: 10px;
  padding-left: 6px;
  height: 29px
}

.fill-row .opacity-field {
  width: 54px
}

.fill-row .opacity-field input {
  padding: 0 3px 0 7px
}

.fill-row .opacity-field .unit {
  margin-right: 6px
}

.segmented {
  display: flex;
  background: var(--field);
  border-radius: 6px;
  padding: 3px;
  gap: 2px
}

.segmented button {
  flex: 1;
  border-radius: 4px;
  height: 26px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px
}

.segmented button svg {
  width: 15px;
  height: 15px
}

.segmented button.active {
  background: var(--panel-3);
  color: var(--text);
  box-shadow: 0 1px 4px #0002
}

.segmented button:hover {
  color: var(--text)
}

.small-label {
  font-size: 9px;
  color: var(--muted)
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 12px
}

.checkbox-row input {
  accent-color: var(--accent);
  margin: 0;
  width: 12px;
  height: 12px
}

.inspector-footer {
  height: 39px;
  border-top: 1px solid var(--border-soft);
  padding: 0 12px 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 8px;

/**
 * Vellum Storage Engine
 * Multi-project persistence layer supporting:
 * 1. Native macOS SQLite database (when running inside Tauri desktop app)
 * 2. High-performance IndexedDB (when running in web browser or local server)
 */

class StorageEngine {
  constructor() {
    this.mode = 'indexeddb'; // 'sqlite' or 'indexeddb'
    this.db = null;
    this.activeProjectId = null;
    this.isTauri = false;
  }

  async init() {
    // Detect Tauri environment
    const tauri = window.__TAURI__ || window.__TAURI_INTERNALS__;
    if (tauri) {
      try {
        this.isTauri = true;
        const res = await this._invokeTauri('init_database');
        if (res && res.success) {
          this.mode = 'sqlite';
          console.info('[StorageEngine] Running with native SQLite backend');
          return;
        }
      } catch (err) {
        console.warn('[StorageEngine] Tauri SQLite init error, falling back to IndexedDB:', err);
      }
    }

    // Browser IndexedDB mode
    this.mode = 'indexeddb';
    await this._initIndexedDB();
    console.info('[StorageEngine] Running with browser IndexedDB backend');
  }

  async _invokeTauri(cmd, args = {}) {
    if (window.__TAURI__?.core?.invoke) {
      return await window.__TAURI__.core.invoke(cmd, args);
    }
    if (window.__TAURI_INTERNALS__?.invoke) {
      return await window.__TAURI_INTERNALS__.invoke(cmd, args);
    }
    throw new Error('Tauri IPC not available');
  }

  async _initIndexedDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('vellum-editor', 2);
      req.onupgradeneeded = (e) => {
        const db = req.result;
        if (!db.objectStoreNames.contains('projects')) {
          const store = db.createObjectStore('projects', { keyPath: 'id' });
          store.createIndex('updated_at', 'updated_at', { unique: false });
        }
        if (!db.objectStoreNames.contains('documents')) {
          db.createObjectStore('documents');
        }
      };
      req.onsuccess = () => {
        this.db = req.result;
        resolve();
      };
      req.onerror = () => reject(req.error);
    });
  }

  /**
   * List all projects with summaries (excluding heavy document_data for performance)
   * @returns {Promise<Array<{id: string, name: string, thumbnail: string|null, page_count: number, layer_count: number, created_at: number, updated_at: number}>>}
   */
  async listProjects() {
    if (this.mode === 'sqlite') {
      return await this._invokeTauri('list_projects');
    }

    // IndexedDB implementation
    return new Promise((resolve, reject) => {
      if (!this.db) return resolve([]);
      const tx = this.db.transaction('projects', 'readonly');
      const store = tx.objectStore('projects');
      const index = store.index('updated_at');
      const req = index.openCursor(null, 'prev'); // newest first
      const results = [];

      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const item = cursor.value;
          results.push({
            id: item.id,
            name: item.name,
            thumbnail: item.thumbnail || null,
            page_count: item.page_count || 1,
            layer_count: item.layer_count || 0,
            created_at: item.created_at || item.updated_at || Date.now(),
            updated_at: item.updated_at || Date.now()
          });
          cursor.continue();
        } else {
          resolve(results);
        }
      };
      req.onerror = () => reject(req.error);
    });
  }

  /**
   * Retrieve a project by ID, including its full document_data JSON string
   * @param {string} id
   * @returns {Promise<Object|null>}
   */
  async getProject(id) {
    if (this.mode === 'sqlite') {
      return await this._invokeTauri('get_project', { id });
    }

    return new Promise((resolve, reject) => {
      if (!this.db) return resolve(null);
      const tx = this.db.transaction('projects', 'readonly');
      const req = tx.objectStore('projects').get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  /**
   * Save or update a project
   */
  async saveProject({ id, name, documentData, thumbnail = null, pageCount = 1, layerCount = 0 }) {
    const now = Date.now();
    this.activeProjectId = id;

    if (this.mode === 'sqlite') {
      return await this._invokeTauri('save_project', {
        id,
        name,
        documentData,
        thumbnail,
        pageCount,
        layerCount,
        updatedAt: now
      });
    }

    // IndexedDB implementation
    return new Promise((resolve, reject) => {
      if (!this.db) return resolve();
      const tx = this.db.transaction('projects', 'readwrite');
      const store = tx.objectStore('projects');
      
      const getReq = store.get(id);
      getReq.onsuccess = () => {
        const existing = getReq.result;
        const record = {
          id,
          name,
          thumbnail: thumbnail !== null ? thumbnail : (existing?.thumbnail || null),
          document_data: documentData,
          page_count: pageCount,
          layer_count: layerCount,
          created_at: existing?.created_at || now,
          updated_at: now
        };
        const putReq = store.put(record);
        putReq.onsuccess = () => resolve(record);
        putReq.onerror = () => reject(putReq.error);
      };
      getReq.onerror = () => reject(getReq.error);
    });
  }

  /**
   * Delete a project
   * @param {string} id
   */
  async deleteProject(id) {
    if (this.mode === 'sqlite') {
      return await this._invokeTauri('delete_project', { id });
    }

    return new Promise((resolve, reject) => {
      if (!this.db) return resolve();
      const tx = this.db.transaction('projects', 'readwrite');
      const req = tx.objectStore('projects').delete(id);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  }

  /**
   * Duplicate a project
   * @param {string} id
   */
  async duplicateProject(id) {
    const original = await this.getProject(id);
    if (!original) throw new Error('Project not found to duplicate');

    const newId = 'proj_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const newName = original.name.startsWith('Copy of ') ? original.name : `Copy of ${original.name}`;

    return await this.saveProject({
      id: newId,
      name: newName,
      documentData: original.document_data,
      thumbnail: original.thumbnail,
      pageCount: original.page_count,
      layerCount: original.layer_count
    });
  }

  /**
   * Get the dedicated ~/Documents/Vellum directory path
   */
  async getDocumentsDir() {
    if (this.isTauri) {
      return await this._invokeTauri('get_documents_vellum_dir');
    }
    return 'Documents/Vellum';
  }

  /**
   * Save a .vellum document to ~/Documents/Vellum
   * @param {string} name
   * @param {string} content - JSON serialized vellum document
   * @returns {Promise<{success: boolean, filename: string, path: string}>}
   */
  async saveToDocuments(name, content) {
    if (this.isTauri) {
      return await this._invokeTauri('save_document_to_vellum_folder', { name, content });
    }
    // Web fallback
    const filename = (name.endsWith('.vellum') ? name : `${name}.vellum`).replace(/[^\w.-]/g, '_');
    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return { success: true, filename, path: filename };
  }

  /**
   * List all .vellum files inside ~/Documents/Vellum
   * @returns {Promise<Array<{filename: string, path: string, size_bytes: number, modified_at: number, title: string, page_count?: number, layer_count?: number}>>}
   */
  async listDocumentsFiles() {
    if (this.isTauri) {
      return await this._invokeTauri('list_documents_vellum_files');
    }
    return [];
  }

  /**
   * Read a .vellum file from disk
   * @param {string} path
   * @returns {Promise<string>}
   */
  async readDocumentFile(path) {
    if (this.isTauri) {
      return await this._invokeTauri('read_document_file', { path });
    }
    throw new Error('Direct file system reading only available in Desktop mode');
  }

  /**
   * Reveal ~/Documents/Vellum (or a specific file) in macOS Finder
   * @param {string|null} path
   */
  async revealInFinder(path = null) {
    if (this.isTauri) {
      return await this._invokeTauri('reveal_in_finder', { path });
    }
  }

  /**
   * Check if a file was passed as argument when launching the app
   * @returns {Promise<string|null>}
   */
  async getCliFileArg() {
    if (this.isTauri) {
      try {
        return await this._invokeTauri('get_cli_file_arg');
      } catch (e) {
        return null;
      }
    }
    return null;
  }
}
